name: Daily Tech Briefing

on:
  schedule:
    - cron: "0 5 * * *" # 08:00 in Riyadh (UTC+3)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Generate briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: tech-brief generate --limit 5

      - name: Upload briefing
        uses: actions/upload-artifact@v6
        with:
          name: tech-briefing
          path: daily_briefings/*.md
          retention-days: 30
