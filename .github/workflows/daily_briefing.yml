name: Daily Tech Briefing



on:

  schedule:
  
    - cron: '0 8 * * *' # Runs every day at 8 AM Riyadh time (approx 05:00 UTC)
    
  workflow_dispatch: # Allows manual trigger
  


permissions:

  contents: write
  


jobs:

  update-briefing:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v3
        


      - name: Set up Python
      
        uses: actions/setup-python@v4
        
        with:
        
          python-version: '3.11'
          


      - name: Install dependencies
      
        run: |
        
          python -m pip install --upgrade pip
          
          pip install -r requirements.txt
          


      - name: Run news summarizer
      
        env:
        
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
        run: python main.py
        


      - name: Commit and push changes
      
        run: |
        
          git config --local user.email "action@github.com"
          
          git config --local user.name "GitHub Action"
          
          git add daily_briefings/*.md
          
          git commit -m "docs: add daily tech briefing for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          
          git push
          




























