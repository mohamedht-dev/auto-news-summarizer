name: Daily Tech Briefing

on:
  schedule:
    # 05:00 UTC is 08:00 AM in Riyadh (UTC+3)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run news summarizer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-4o-mini"
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_briefings/
          # Only commit if there are changes to avoid workflow failure
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: add daily tech briefing for $(date +'%Y-%m-%d')" && git push)
