name: Daily Tech Briefing

on:
  schedule:
    - cron: '0 5 * * *' # 5:00 AM UTC = 8:00 AM Riyadh Time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run news summarizer
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        tech-brief generate --limit 5

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add daily_briefings/
        git commit -m "Update daily briefing [skip ci]" || echo "No changes to commit"
        git push
