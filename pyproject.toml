[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-ai-tech-brief"
version = "0.3.0"
description = "An open-source Python tool that generates bilingual daily technology briefings from RSS feeds using AI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Mohamed Awad", email = "moha.awd@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: News",
    "Intended Audience :: Developers",
]
dependencies = [
    "openai>=2.0.0,<3.0.0",
    "feedparser>=6.0.10",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[project.scripts]
tech-brief = "tech_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[project.urls]
"Homepage" = "https://github.com/mohamedht-dev/auto-news-summarizer"
"Bug Tracker" = "https://github.com/mohamedht-dev/auto-news-summarizer/issues"
