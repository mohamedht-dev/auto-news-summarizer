[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-ai-tech-brief"
version = "0.4.0"
description = "A bilingual AI technology news platform powered by RSS feeds and OpenAI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Mohamed Awad", email = "moha.awd@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: News",
    "Intended Audience :: Developers",
]
dependencies = [
    "openai>=2.0.0,<3.0.0",
    "feedparser>=6.0.10",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.18,<1.0.0",
    "itsdangerous>=2.2.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[project.scripts]
tech-brief = "tech_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tech_brief.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[project.urls]
"Homepage" = "https://github.com/mohamedht-dev/auto-news-summarizer"
"Bug Tracker" = "https://github.com/mohamedht-dev/auto-news-summarizer/issues"
